# Codemagic configuration for Ulfah Chat Android APK Build
# Place this file in the root of your repository

workflows:
  android-apk:
    name: Ulfah Chat Android APK Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      java: 17
      android_ndk: 25.2.9519653
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Build Android Debug APK
        script: |
          cd android
          gradle assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - teemabdulrehman.com@gmail.com
        notify:
          success: true
          failure: true
