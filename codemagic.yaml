# Codemagic configuration for Ulfah Chat Android APK Build
# Place this file in the root of your repository

workflows:
  android-apk:
    name: Ulfah Chat Android APK Build
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          cd android
          gradle wrapper --gradle-version 8.0
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - teemabdulrehman.com@gmail.com
        notify:
          success: true
          failure: true
